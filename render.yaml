services:
  - type: web
    name: takeonbnb29-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/apps/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://takeonbnb-api.onrender.com
