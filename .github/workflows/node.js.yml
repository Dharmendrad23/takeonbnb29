name: Node.js CI

on:
  push:
    branches:
      - main
      - feature/nodejs-mongodb-migration
      - agents/open-website-frontend

  pull_request:
    branches:
      - main
      - agents/open-website-frontend

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }} Website change if you have the I am notified with stem K hundred percent sure
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build --if-present

      - name: Run tests
        run: npm test --if-present