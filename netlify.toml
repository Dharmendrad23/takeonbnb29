# Netlify configuration for TakeOnBnB
# This file configures build settings and rewrites for the Netlify deployment

[build]
  command = "npm run build"
  publish = "dist/apps/web"

# Proxy all API requests to Render backend through Netlify
# This bypasses CORS issues by making requests server-side
[[redirects]]
  from = "/api/*"
  to = "https://takeonbnb29.onrender.com/api/:splat"
  status = 200
  force = false

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables
[env.production]
  VITE_API_URL = "/api"
